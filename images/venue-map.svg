<svg xmlns="http://www.w3.org/2000/svg" viewBox="560 330 1090 990" role="img" aria-label="루이비스컨벤션 송파문정점 약도: 문정역 4번 출구 앞에서 셔틀버스를 타고 C/D동 주차장 입구에서 내립니다">
  <defs>
    <clipPath id="mapclip"><rect x="560" y="330" width="1090" height="690" rx="36"/></clipPath>
  </defs>
  <style>
    text { font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #3a3330; paint-order: stroke; stroke: #f4f1ea; stroke-width: 7px; stroke-linejoin: round; }
    .lm { font-size: 29px; fill: #6f675f; text-anchor: middle; }
    .nostroke { stroke: none; }
  </style>
  <rect x="560" y="330" width="1090" height="990" fill="#faf6f1"/>

  <g clip-path="url(#mapclip)">
    <rect x="560" y="330" width="1090" height="690" fill="#f4f1ea"/>

    <!-- 녹지 -->
    <g fill="#dcebd6">
      <polygon points="480,470 950,255 960,330 700,448 560,545"/>
      <polygon points="668,946 1152,742 1158,778 694,988"/>
    </g>

    <!-- 일반 도로 (테두리 + 흰색) -->
    <g fill="none" stroke-linejoin="round" stroke-linecap="butt">
      <g stroke="#dcd6ca" stroke-width="40">
        <path d="M300 520 L960 245 L1290 75"/>
        <path d="M1003 330 L1095 525 L1200 790 L1300 1010"/>
        <path d="M545 640 L580 745 L690 990 L715 1040"/>
        <path d="M505 612 L760 633 L930 600 L1090 518 L1280 442 L1380 412"/>
        <path d="M640 925 L1165 714"/>
      </g>
      <g stroke="#fff" stroke-width="32">
        <path d="M300 520 L960 245 L1290 75"/>
        <path d="M1003 330 L1095 525 L1200 790 L1300 1010"/>
        <path d="M545 640 L580 745 L690 990 L715 1040"/>
        <path d="M505 612 L760 633 L930 600 L1090 518 L1280 442 L1380 412"/>
        <path d="M640 925 L1165 714"/>
      </g>
    </g>

    <!-- 셔틀 이동 경로: 4번 출구 → 예식장 남쪽 도로 → C/D동 주차장 입구 -->
    <path d="M1318 430 L1280 442 L1092 520 L1171 716 L656 919 L610 812" fill="none" stroke="#fff" stroke-width="17" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M1318 430 L1280 442 L1092 520 L1171 716 L656 919 L610 812" fill="none" stroke="#7b3f8c" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- 8호선 대로 -->
    <path d="M1265 0 L1710 1110" stroke="#ecd98a" stroke-width="54" fill="none"/>
    <path d="M1265 0 L1710 1110" stroke="#f9ebb0" stroke-width="46" fill="none"/>
    <path d="M1265 0 L1710 1110" stroke="#d6336c" stroke-width="5" fill="none"/>

    <!-- 문정역 -->
    <path d="M1415 397 L1550 672" stroke="#d6336c" stroke-width="38" fill="none"/>
    <path d="M1384 420 L1430 534 M1418 490 L1498 480 M1480 436 L1494 468" stroke="#d6336c" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="1480" cy="540" r="24" fill="#fff" stroke="#d6336c" stroke-width="7"/>
    <text class="nostroke" x="1480" y="551" text-anchor="middle" style="font-size:32px;font-weight:700;fill:#d6336c;stroke:none">8</text>
    <text x="1404" y="600" text-anchor="middle" style="font-size:36px;font-weight:700">문정역</text>
    <circle cx="1377" cy="408" r="19" fill="#ffd84d" stroke="#fff" stroke-width="3"/>
    <circle cx="1480" cy="421" r="17" fill="#ffd84d" stroke="#fff" stroke-width="3"/>
    <circle cx="1500" cy="480" r="17" fill="#ffd84d" stroke="#fff" stroke-width="3"/>
    <circle cx="1432" cy="543" r="17" fill="#ffd84d" stroke="#fff" stroke-width="3"/>
    <text class="nostroke" x="1377" y="417" text-anchor="middle" style="font-size:25px;font-weight:700;stroke:none">4</text>
    <text class="nostroke" x="1480" y="429" text-anchor="middle" style="font-size:22px;font-weight:700;stroke:none">1</text>
    <text class="nostroke" x="1500" y="488" text-anchor="middle" style="font-size:22px;font-weight:700;stroke:none">2</text>
    <text class="nostroke" x="1432" y="551" text-anchor="middle" style="font-size:22px;font-weight:700;stroke:none">3</text>

    <!-- 주변 지명 -->
    <text class="lm" x="652" y="660">대전대학교</text>
    <text class="lm" x="652" y="692">서울한방병원</text>
    <text class="lm" x="870" y="586">스타벅스</text>
    <text class="lm" x="1040" y="696">문정현대</text>
    <text class="lm" x="1040" y="728">지식산업센터</text>
    <text class="lm" x="1290" y="802">문정역 테라타워</text>
    <text class="lm" x="1100" y="1004">서울동부지방법원</text>

    <!-- 셔틀 타는 곳 (4번 출구 앞) -->
    <path d="M1332 400 L1360 405" stroke="#d6336c" stroke-width="7" stroke-linecap="round"/>
    <rect x="1296" y="380" width="44" height="48" rx="10" fill="#2b2522" stroke="#fff" stroke-width="3"/>
    <rect x="1303" y="388" width="30" height="17" rx="3" fill="#fff"/>
    <circle cx="1310" cy="416" r="4" fill="#fff"/><circle cx="1326" cy="416" r="4" fill="#fff"/>
    <rect x="1230" y="342" width="176" height="38" rx="19" fill="#ffe14d"/>
    <text class="nostroke" x="1318" y="369" text-anchor="middle" style="font-size:27px;font-weight:700;stroke:none">셔틀 타는 곳</text>

    <!-- 예식장 -->
    <rect x="640" y="704" width="280" height="76" rx="18" fill="#fff" stroke="#b08968" stroke-width="4"/>
    <path d="M752 780 L770 806 L788 780 Z" fill="#fff" stroke="#b08968" stroke-width="4" stroke-linejoin="round"/>
    <rect x="750" y="776" width="40" height="8" fill="#fff"/>
    <text class="nostroke" x="780" y="739" text-anchor="middle" style="font-size:34px;font-weight:700;stroke:none">루이비스컨벤션</text>
    <text class="nostroke" x="780" y="768" text-anchor="middle" style="font-size:25px;fill:#8a7f78;stroke:none">송파문정점 · B1층</text>
    <!-- C/D동 주차장 입구 (셔틀 하차) -->
    <circle cx="610" cy="812" r="19" fill="#c0615a" stroke="#fff" stroke-width="4"/>
    <text class="nostroke" x="610" y="821" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#fff;stroke:none">P</text>
    <text x="646" y="854" style="font-size:26px;font-weight:700;fill:#c0615a">C/D동</text>
    <text x="646" y="884" style="font-size:26px;font-weight:700;fill:#c0615a">주차장 입구</text>
    <circle cx="770" cy="830" r="26" fill="#b08968" stroke="#fff" stroke-width="5"/>
    <circle cx="770" cy="830" r="9" fill="#fff"/>
    <path d="M1340 985 H1388" stroke="#7b3f8c" stroke-width="9" stroke-linecap="round"/>
    <text class="lm" x="1402" y="994" style="text-anchor:start">셔틀 이동 경로</text>
  </g>

  <!-- 문정역 4번 출구 안내 -->
  <rect x="590" y="1052" width="1030" height="250" rx="28" fill="#fff" stroke="#e8dfd6" stroke-width="3"/>
  <text class="nostroke" x="630" y="1102" style="font-size:36px;font-weight:700;fill:#d6336c;stroke:none">문정역 4번 출구에서</text>
  <rect x="630" y="1124" width="136" height="44" rx="22" fill="#ffe14d"/>
  <text class="nostroke" x="698" y="1155" text-anchor="middle" style="font-size:27px;font-weight:700;stroke:none">셔틀 이용</text>
  <text class="nostroke" x="790" y="1156" style="font-size:31px;stroke:none">4번 출구 계단 → 지상 셔틀 타는 곳</text>
  <rect x="630" y="1182" width="136" height="44" rx="22" fill="#e8dfd6"/>
  <text class="nostroke" x="698" y="1213" text-anchor="middle" style="font-size:27px;font-weight:700;stroke:none">지하 보도</text>
  <text class="nostroke" x="790" y="1214" style="font-size:31px;stroke:none">지하 보도로 6분 (에스컬레이터 이용)</text>
  <rect x="630" y="1240" width="136" height="44" rx="22" fill="#c0615a"/>
  <text class="nostroke" x="698" y="1271" text-anchor="middle" style="font-size:27px;font-weight:700;fill:#fff;stroke:none">하차</text>
  <text class="nostroke" x="790" y="1272" style="font-size:31px;stroke:none">C/D동 주차장 입구 앞에 내려 드립니다</text>
</svg>
