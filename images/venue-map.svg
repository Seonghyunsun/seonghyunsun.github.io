<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-label="루이비스컨벤션 송파문정점 약도">
  <style>
    text { font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #3a3330; }
    .lm { font-size: 8px; fill: #9a8f87; }
    .st { font-size: 10px; font-weight: 700; }
    .sub { font-size: 7px; fill: #8a7f78; }
  </style>
  <rect width="360" height="330" rx="16" fill="#f3ece4"/>

  <!-- 도로 -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 112 H346" stroke-width="9"/>
    <path d="M30 205 H334" stroke-width="9"/>
    <path d="M205 40 V288" stroke-width="9"/>
    <path d="M262 98 L320 262" stroke-width="13"/>
    <path d="M150 52 V112" stroke-width="6"/>
  </g>

  <!-- 동부간선도로 -->
  <path d="M56 46 L134 296" stroke="#cdc3b8" stroke-width="17" stroke-linecap="round" fill="none"/>
  <path d="M65 46 L143 296" stroke="#bcd8e8" stroke-width="5" stroke-linecap="round" fill="none"/>
  <text transform="translate(86 150) rotate(72.6)" font-size="8" style="fill:#fff;font-size:8px;letter-spacing:2px">동부간선도로</text>

  <!-- 주변 지명 -->
  <text class="lm" x="150" y="38" text-anchor="middle">가락시장</text>
  <text class="lm" x="134" y="100" text-anchor="middle">올림픽훼밀리타운</text>
  <text class="lm" x="176" y="86" text-anchor="middle">훼밀리타운사거리</text>
  <text class="lm" x="318" y="38" text-anchor="middle">문정동 로데오거리</text>
  <text class="lm" x="224" y="222" text-anchor="middle">문정동 법조타운</text>
  <text class="lm" x="150" y="224" text-anchor="middle">서울동부지방검찰청</text>
  <text class="lm" x="262" y="242" text-anchor="middle">서울동부지방법원</text>
  <text class="lm" x="244" y="262" text-anchor="middle">하비오푸르지오</text>
  <text class="lm" x="226" y="284" text-anchor="middle">가든파이브</text>
  <text class="lm" x="20" y="132">이마트</text>

  <!-- 경로: 수서역 방면 (도보·차량) -->
  <path d="M52 70 H84 L141 174" fill="none" stroke="#3a3330" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 경로: 문정역 4번출구 셔틀 -->
  <path d="M264 130 H240 V183 H194" fill="none" stroke="#b08968" stroke-width="2.8" stroke-dasharray="6 4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 수서역 -->
  <circle cx="36" cy="70" r="10" fill="#ef7c1c"/>
  <text x="36" y="74" text-anchor="middle" style="fill:#fff;font-size:11px;font-weight:700">3</text>
  <text class="st" x="36" y="91" text-anchor="middle">수서역</text>
  <text class="sub" x="36" y="100" text-anchor="middle">3호선·SRT</text>

  <!-- 문정역 -->
  <circle cx="276" cy="130" r="10" fill="#d6006d"/>
  <text x="276" y="134" text-anchor="middle" style="fill:#fff;font-size:11px;font-weight:700">8</text>
  <text class="st" x="291" y="146" style="font-size:11px;fill:#d6006d">문정역</text>
  <rect x="262" y="98" width="34" height="14" rx="7" fill="#fff" stroke="#d6006d" stroke-width="1"/>
  <text x="279" y="108" text-anchor="middle" style="font-size:8px;font-weight:700;fill:#d6006d">4번 출구</text>

  <!-- 셔틀 타는 곳 -->
  <rect x="238" y="52" width="82" height="20" rx="10" fill="#ffe14d"/>
  <text x="279" y="66" text-anchor="middle" style="font-size:9.5px;font-weight:700">셔틀 타는 곳</text>
  <path d="M279 72 V98" stroke="#e0b800" stroke-width="1.2" stroke-dasharray="2 2"/>

  <!-- 장지역 -->
  <circle cx="318" cy="244" r="9" fill="#d6006d"/>
  <text x="318" y="248" text-anchor="middle" style="fill:#fff;font-size:10px;font-weight:700">8</text>
  <text class="st" x="318" y="264" text-anchor="middle" style="font-size:9px">장지역</text>

  <!-- 주차장 입구 -->
  <circle cx="139" cy="180" r="7.5" fill="#c0615a"/>
  <text x="139" y="183.5" text-anchor="middle" style="fill:#fff;font-size:9px;font-weight:700">P</text>
  <text x="121" y="199" style="font-size:7.5px;font-weight:700;fill:#c0615a">주차장 입구</text>

  <!-- 예식장 -->
  <rect x="164" y="170" width="26" height="26" rx="6" fill="#b08968"/>
  <text x="177" y="188" text-anchor="middle" style="fill:#fff;font-size:13px;font-weight:700">D</text>
  <g>
    <rect x="125" y="126" width="104" height="32" rx="8" fill="#fff" stroke="#b08968" stroke-width="1.4"/>
    <path d="M170 158 L177 168 L184 158 Z" fill="#fff" stroke="#b08968" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="168" y="156" width="18" height="3" fill="#fff"/>
    <text x="177" y="140" text-anchor="middle" style="font-size:11px;font-weight:700">루이비스컨벤션</text>
    <text x="177" y="152" text-anchor="middle" style="font-size:8px;fill:#8a7f78">H비즈니스파크 D동</text>
  </g>

  <!-- 범례 -->
  <g transform="translate(22 304)">
    <path d="M0 0 H26" stroke="#b08968" stroke-width="2.8" stroke-dasharray="6 4" stroke-linecap="round"/>
    <text x="34" y="3" style="font-size:8.5px">문정역 4번 출구 셔틀버스</text>
    <path d="M150 0 H176" stroke="#3a3330" stroke-width="2.2" stroke-linecap="round"/>
    <text x="184" y="3" style="font-size:8.5px">수서역 방면 도보·차량</text>
  </g>
</svg>
