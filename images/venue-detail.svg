<svg xmlns="http://www.w3.org/2000/svg" viewBox="330 440 800 660" role="img" aria-label="H비즈니스파크 상세 약도: 정의로 쪽 C/D동 주차장 입구, C동, D동(루이비스컨벤션)">
  <defs>
    <clipPath id="clip"><rect x="330" y="440" width="800" height="660" rx="36"/></clipPath>
  </defs>
  <style>
    text { font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #3a3330; paint-order: stroke; stroke: #f4f1ea; stroke-width: 7px; stroke-linejoin: round; }
    .road { font-size: 24px; fill: #8a7f78; text-anchor: middle; letter-spacing: 3px; }
    .nostroke { stroke: none; }
  </style>
  <g clip-path="url(#clip)">
    <rect x="330" y="440" width="800" height="660" fill="#f4f1ea"/>

    <!-- 공원 -->
    <polygon points="838,518 985,382 1100,350 1225,690 1070,765 1015,790" fill="#dcebd6"/>

    <!-- 도로 (테두리 + 흰색) -->
    <g fill="none" stroke-linejoin="round">
      <g stroke="#dcd6ca">
        <path d="M158 330 L273 570 L383 800 L479 1000 L520 1110" stroke-width="140"/>
        <path d="M500 1100 L1364 745" stroke-width="158"/>
        <path d="M385 628 L700 493 L985 358" stroke-width="54"/>
      </g>
      <g stroke="#fff">
        <path d="M158 330 L273 570 L383 800 L479 1000 L520 1110" stroke-width="132"/>
        <path d="M500 1100 L1364 745" stroke-width="150"/>
        <path d="M385 628 L700 493 L985 358" stroke-width="46"/>
      </g>
    </g>

    <!-- 건물 -->
    <polygon points="490,630 700,520 742,743 585,805" fill="#e9e6df" stroke="#d9d3c8" stroke-width="3"/>
    <polygon points="395,675 490,628 585,805 690,745 742,743 832,862 548,997" fill="#fbfaf7" stroke="#d9d3c8" stroke-width="4"/>
    <polygon points="702,522 834,514 1018,792 872,852 848,838" fill="#f1dfcb" stroke="#b08968" stroke-width="5"/>

    <!-- 도로명 -->
    <text class="road" transform="translate(440 930) rotate(64.4)">정 의 로</text>
    <text class="road" transform="translate(1040 884) rotate(-22.3)">법 원 로</text>
    <text class="road" transform="translate(560 553) rotate(-23)">법원로9길</text>

    <!-- 건물명 -->
    <text x="640" y="660" text-anchor="middle" style="font-size:24px;fill:#8a7f78">H비즈니스파크</text>
    <text x="650" y="852" text-anchor="middle" style="font-size:46px;font-weight:700;fill:#8a7f78">C동</text>
    <text x="838" y="640" text-anchor="middle" style="font-size:46px;font-weight:700;fill:#8f5f3a;stroke:#f1dfcb">D동</text>

    <!-- 셔틀 이동선 -->
    <path d="M1130 809 L547 1049 L418 800" fill="none" stroke="#fff" stroke-width="17" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M1130 809 L547 1049 L418 800" fill="none" stroke="#7b3f8c" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
    <text transform="translate(850 976) rotate(-22.3)" text-anchor="middle" style="font-size:25px;font-weight:700;fill:#7b3f8c">문정역 방면 셔틀</text>

    <!-- 주차장 입구 -->
    <circle cx="418" cy="806" r="22" fill="#c0615a" stroke="#fff" stroke-width="5"/>
    <text class="nostroke" x="418" y="816" text-anchor="middle" style="font-size:27px;font-weight:700;fill:#fff;stroke:none">P</text>
    <text x="486" y="800" style="font-size:27px;font-weight:700;fill:#c0615a;stroke:#fbfaf7">C/D동</text>
    <text x="486" y="832" style="font-size:27px;font-weight:700;fill:#c0615a;stroke:#fbfaf7">주차장 입구</text>

    <!-- D동 = 루이비스컨벤션 -->
    <path d="M846 716 L962 560" stroke="#b08968" stroke-width="4" stroke-linecap="round"/>
    <circle cx="846" cy="716" r="22" fill="#b08968" stroke="#fff" stroke-width="5"/>
    <circle cx="846" cy="716" r="8" fill="#fff"/>
    <rect x="900" y="460" width="206" height="104" rx="18" fill="#fff" stroke="#b08968" stroke-width="4"/>
    <text class="nostroke" x="1003" y="496" text-anchor="middle" style="font-size:25px;font-weight:700;fill:#8f5f3a;stroke:none">D동</text>
    <text class="nostroke" x="1003" y="530" text-anchor="middle" style="font-size:30px;font-weight:700;stroke:none">루이비스컨벤션</text>
    <text class="nostroke" x="1003" y="554" text-anchor="middle" style="font-size:22px;fill:#8a7f78;stroke:none">웨딩홀 · B1층</text>
  </g>
</svg>
